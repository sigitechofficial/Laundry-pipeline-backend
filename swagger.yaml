          schema:
            type: string
      parameters:
        - name: accessToken
          in: header
          schema:
            type: string
          example: '{{adminToken}}'
      responses:
        '200':
          description: OK
          headers:
            X-Powered-By:
              schema:
                type: string
                example: Express
            Access-Control-Allow-Origin:
              schema:
                type: string
                example: '*'
            Content-Type:
              schema:
                type: string
                example: application/json; charset=utf-8
            Content-Length:
              schema:
                type: integer
                example: '757'
            ETag:
              schema:
                type: string
                example: W/"2f5-+U67onL75a2dIZnV30rIKPWIwZY"
            Date:
              schema:
                type: string
                example: Fri, 28 Jun 2024 12:14:32 GMT
            Connection:
              schema:
                type: string
                example: keep-alive
            Keep-Alive:
              schema:
                type: string
                example: timeout=5
          content:
            application/json:
              schema:
                type: object
              example:
                status: '1'
                message: All Vehicles Types
                data:
                  vehicleData:
                    - id: 12
                      title: Car
                      image: >-
                        Public/Images/VehicleTypes/vehicleImage-Car-1709116160071.png
                      status: true
                      baseRate: 10
                      perUnitRate: 5
                      perRideCharge: 0
                      weightCapacity: 100000
                      volumeCapacity: 100000
                      createdAt: '2024-02-28T10:29:20.000Z'
                      updatedAt: '2024-02-28T10:29:20.000Z'
                      appUnitId: null
                    - id: 13
                      title: Truck
                      image: >-
                        Public/Images/VehicleTypes/vehicleImage-Truck-1709116250211.png
                      status: true
                      baseRate: 50
                      perUnitRate: 30
                      perRideCharge: 0
                      weightCapacity: 100000
                      volumeCapacity: 100000
                      createdAt: '2024-02-28T10:30:50.000Z'
                      updatedAt: '2024-02-28T10:30:50.000Z'
                      appUnitId: null
                  unit:
                    weight: lbs
                    length: in
                    distance: km
                    currency: $
                error: ''
