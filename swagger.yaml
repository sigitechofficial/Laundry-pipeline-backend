  /agent/orderDetailsById:
   get:
      summary: Get booking details by bookingId or orderTrackId (Agent)
      description: Retrieves detailed booking/order information for the agent using either `bookingId` or `orderTrackId`. If the booking is in status 5, includes a 1-hour time window.
      tags:
        - Agent > Agent Handle Booking
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Required access token (cookie)
        - in: query
          name: bookingId
          required: false
          schema:
            type: integer
          description: Booking ID of the order (optional if orderTrackId is provided)
        - in: query
          name: orderTrackId
          required: false
          schema:
            type: string
          description: Order tracking ID (optional if bookingId is provided)
      responses:
        '200':
          description: Booking details fetched successfully
          content:
            application/json:
              examples:
                default:
                  summary: Booking details
                  value:
                    status: "1"
                    message: "Order Details for bookingId: 456"
                    data:
                      id: 456
                      customer:
                        id: 789
                        firstName: "John"
                        lastName: "Doe"
                        email: "john@example.com"
                      pickupAddress:
                        title: "Home"
                        streetAddress: "123 Main St"
                        district: "Downtown"
                        province: "Dubai"
                      bookingStatus:
                        title: "Confirmed"
                        description: "Order has been confirmed"
                      bookingHistory:
                        - date: "2025-05-21"
                          time: "13:00"
                          bookingStatus:
                            title: "Created"
                            description: "Order created"
                status5:
                  summary: Includes 1-hour time for bookingStatusId = 5
                  value:
                    status: "1"
                    message: "Order Details for orderTrackId: 456-XYZ"
                    data:
                      bookingfind: { /* booking object */ }
                      oneHourLater: "16:15 PM"
                    error: ""
        '400':
          description: Missing query parameter
          content:
            application/json:
              example:
                status: "0"
                message: "bookingId or orderTrackId must be provided"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Something went wrong while retrieving the order"

