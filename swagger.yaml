openapi: 3.0.0
info:
  title: Laundary Service App
  version: 1.0.0
servers:
  - url: http://localhost:3010
tags:
  - name: Customer
  - name: Customer > Auth
  - name: Customer > User Profile
    description: Here are user get profile and update profile routes.
  - name: Customer > Booking Management
  - name: Admin
  - name: Admin > Create Services, Categories && SubCategories
  - name: Admin > Vehicle Types
  - name: Admin > Cities & Countries
  - name: Admin > zones
  - name: Admin > Admin Login
  - name: Admin > Get Laundary Shops
  - name: Admin > Cancel Booking
  - name: Admin > Machinery
  - name: Admin > Account Preferences
  - name: Admin > On Hold
  - name: Admin > Customer Management
  - name: Admin > Driver Management
  - name: Driver
  - name: Driver > Driver Auth
  - name: Agent
  - name: Agent > Auth
  - name: Agent > Agent Shop Address
  - name: Agent > Agent Handle Booking
  - name: Agent > Agent Drivers
  - name: Agent > Add Roles,Permissions && ClassifiedAs
  - name: Agent > Add Employee
  - name: Agent > Services
  - name: Agent > Agent Put Booking On Hold
paths:
  /customer/registerCustomerOTP:
    post:
      tags:
        - Customer > Auth
      summary: Register OTP
      description: >-
        This returns a `token` that you can use to retrieve information later
        on.


        We have included a test to confirm if a token is returned. We have also
        added test scripts to copy the token to the `token` collection variable.
        This makes it easy for us to reuse this token in other requests in the
        collection.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: fasiih1@gmail.com
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /customer/registerCustomer:
    post:
      tags:
        - Customer > Auth
      summary: User Registration
      description: "This request uses the saved `token` collection variable to access a secret 'name' stored against that token.\n\nIn this request, we used the\_`token`\_collection variable as a query param to fetch the name generated for that token. We have added a test to check that a name is correctly returned."
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: Fasih
                lastName:
                  type: string
                  example: Shahbaz
                password:
                  type: integer
                  example: '123456'
                dvToken:
                  type: string
                  example: dfdfdfdfdfd
                phoneNum:
                  type: string
                  example: +44 7712 345678
                userId:
                  type: integer
                  example: '3'
                confirmPassword:
                  type: integer
                  example: '123456'
                countryId:
                  type: integer
                  example: '1'
                cityId:
                  type: integer
                  example: '1'
                profileImage:
                  type: string
                  format: binary
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /customer/verifyOTpSignUp:
    post:
      tags:
        - Customer > Auth
      summary: verify OTP for SignUp
      description: >-
        This request un-registers a token by using the token collection variable
        in the POST body.
        We also added a test to ensure the response has a 200 OK status code.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                otpId: '1'
                OTP: '5678'
                userId: '2'
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
  /customer/loginUser:
    post:
      tags:
        - Customer > Auth
      summary: Login User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                email: azhar@gmail.com
                password: '123456'
                signedFrom: ''
