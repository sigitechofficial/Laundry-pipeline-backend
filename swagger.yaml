  /agent/registerAgent:
    post:
      summary: Register new agent and send OTP
      description: Registers a new agent account with basic details and profile image, then sends an OTP for email verification.
      tags:
        - Agent > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - confirmPassword
                - phoneNum
                - dvToken
                - countryId
                - cityId
              properties:
                firstName:
                  type: string
                  example: "Alex"
                  description: Agent's first name
                lastName:
                  type: string
                  example: "Smith"
                  description: Agent's last name
                email:
                  type: string
                  format: email
                  example: alex.smith@example.com
                  description: Email address for registration
                password:
                  type: string
                  format: password
                  example: Secure@123
                  description: Password for login
                confirmPassword:
                  type: string
                  format: password
                  example: Secure@123
                  description: Confirmation of the password
                phoneNum:
                  type: string
                  example: "+15555550123"
                  description: Phone number of the agent
                dvToken:
                  type: string
                  example: "device-token-xyz"
                  description: Device token for push notifications
                countryId:
                  type: integer
                  example: 1
                  description: ID of the agent's country
                cityId:
                  type: integer
                  example: 101
                  description: ID of the agent's city
                profileImage:
                  type: string
                  format: binary
                  description: Profile image file to upload (optional)
      responses:
        '200':
          description: OTP sent successfully after registration
          content:
            application/json:
              example:
                status: "1"
                message: "OTP sent successfully"
                data:
                  otpId: 789
                  userId: 456
                error: ""
        '400':
          description: Validation or user existence error
          content:
            application/json:
              examples:
                userExists:
                  summary: User already exists
                  value:
                    status: "0"
                    message: "User Already Exists"
                    data: {}
                    error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Unexpected error occurred during registration"
  /agent/verifyOTpSignUp:
    post:
      summary: Verify OTP for agent signup
      description: Verifies the OTP for agent registration and sets up default business working hours.
      tags:
        - Agent > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for OTP verification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otpId
                - OTP
                - userId
              properties:
                otpId:
                  type: integer
                  example: 1234
                  description: ID of the OTP record
                OTP:
                  type: string
                  example: "5678"
                  description: OTP received via email
                userId:
                  type: integer
                  example: 456
                  description: ID of the agent being verified
      responses:
        '200':
          description: OTP verified successfully and working hours created
          content:
            application/json:
              example:
                status: "1"
