              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Something went wrong"
  /agent/addBusinessInfor:
    post:
      summary: Add agent business information
      description: Adds business profile data for an agent including shop name, profile match option, machine inventory, and service time settings.
      tags:
        - Agent > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token (sent in cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shopName
                - matchProfileOptions
                - userId
                - machineryCount
                - serviceTimes
              properties:
                shopName:
                  type: string
                  example: "Elite Laundry & Dry Cleaners"
                  description: Name of the agent's shop
                matchProfileOptions:
                  type: string
                  example: "Franchise"
                  description: Business match profile option; set to "Other" if using `otherText`
                otherText:
                  type: string
                  example: "Self-operated boutique model"
                  description: Custom description shown only if matchProfileOptions is "Other"
                userId:
                  type: integer
                  example: 456
                  description: ID of the agent submitting business info
                machineryCount:
                  type: array
                  description: List of machines and their total count
                  items:
                    type: object
                    required: [total, machineId]
                    properties:
                      total:
                        type: integer
                        example: 4
                        description: Number of machines
                      machineId:
                        type: integer
                        example: 2
                        description: ID of the machine type
                serviceTimes:
                  type: array
                  description: Time estimates for each selected service
                  items:
                    type: object
                    required: [serviceId, serviceTimeRequired]
                    properties:
                      serviceId:
                        type: integer
                        example: 3
                        description: ID of the service
                      serviceTimeRequired:
                        type: string
                        example: "2 hours"
                        description: Estimated time to complete the service
      responses:
        '200':
          description: Business information added successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Bussiness Info Added Sucessfully"
                data: {}
                error: ""
        '400':
          description: "otherText provided without selecting Other as matchProfileOption"
          content:
            application/json:
              example:
                status: "0"
                message: "You cna Add this Field Only when Select Other Option"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Unexpected error occurred while saving business info"
  /agent/loginUser:
    post:
      summary: Agent login
      description: Authenticates an agent using email and password or social login. Returns access token, feature permissions, and profile information.
      tags:
        - Agent > Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - dvToken
              properties:
                email:
                  type: string
                  format: email
                  example: agent@example.com
                  description: Agent email address
                password:
                  type: string
                  example: Agent@123
                  description: Password (required for standard login)
                dvToken:
                  type: string
                  example: "device-token-xyz"
                  description: Device token used for tracking sessions and notifications
                signedFrom:
                  type: string
                  enum: [google, facebook, apple]
                  example: google
                  description: Optional social login provider
      responses:
        '200':
          description: Login success, access token issued and returned in cookie
          content:
            application/json:
              examples:
                standardLoginSuccess:
                  summary: Standard login success
                  value:
                    status: "1"
                    message: "Login successful"
                    data:
                      userId: 123
                      services: []
                      agentInfo: []
                      userMachineInfo: []
                      accessToken: "jwt.token.here"
                    error: ""
                socialLoginRequired:
                  summary: Previously signed up with social provider
                  value:
                    status: "4"
                    message: "Social Login Required"
                    data: {}
                    error: "Please log in using google."
                incompleteProfile:
                  summary: Incomplete profile
                  value:
                    status: "4"
                    message: "Please complete your information before logging in."
                    data:
                      userId: 123
                      services: []
                      agentInfo: []
                      userMachineInfo: []
        '400':
          description: Invalid login attempt
          content:
            application/json:
              examples:
                userNotFound:
                  summary: No user found
                  value:
                    status: "0"
                    message: "User not Exists with this credentials"
                    data: {}
                wrongPassword:
                  summary: Incorrect password
                  value:
                    status: "0"
                    message: "Bad credentials"
                    detail: "Please enter correct password to continue"
                    data: {}
        '403':
          description: Blocked or unverified user
          content:
            application/json:
              examples:
                blocked:
                  summary: Blocked user
                  value:
                    status: "0"
                    message: "Blocked by admin Please contact admin to continue"
                    data: {}
                notVerified:
                  summary: Pending OTP verification
                  value:
                    status: "2"
                    message: "Pending email verification"
                    data:
                      userId: 123
                      otpId: 456
                      email: agent@example.com
                    error: "Please verify your email to continue"
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Something went wrong during login"
