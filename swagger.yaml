  /agent/agentAddressAdd:
     post:
      summary: Add agent's shop address
      description: Adds a laundry shop address for the agent. Only one address can be added per agent. Associates the location with a zone and city using geolocation.
      tags:
        - Agent > Agent Shop Address
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token for verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - streetAddress
                - district
                - province
                - lat
                - lng
                - coordinates
                - addressType
                - userId
              properties:
                streetAddress:
                  type: string
                  example: "123 Main Street"
                district:
                  type: string
                  example: "Downtown"
                province:
                  type: string
                  example: "Dubai"
                lat:
                  type: number
                  example: 25.276987
                lng:
                  type: number
                  example: 55.296249
                coordinates:
                  type: array
                  description: GeoJSON-compatible coordinates defining the address polygon
                  items:
                    type: array
                    items:
                      type: number
                    example: [[55.296249, 25.276987], [55.297000, 25.276987], [55.297000, 25.277500], [55.296249, 25.277500], [55.296249, 25.276987]]
                addressType:
                  type: string
                  example: "Shop"
                  description: The type of address (e.g., Shop, Warehouse)
                userId:
                  type: integer
                  example: 789
                  description: ID of the agent user
      responses:
        '200':
          description: Shop address added successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Laundary Shhop Address Added"
                data:
                  id: 10
                  streetAddress: "123 Main Street"
                  cityId: 3
                  countryId: 1
                  zoneId: 2
                error: ""
        '400':
          description: Address already exists
          content:
            application/json:
              example:
                status: "0"
                message: "Already Added the Shop Address"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Unable to save address"
