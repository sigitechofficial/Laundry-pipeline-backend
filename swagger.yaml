  /admin/customerOnHoldOptions:
    post:
      tags:
        - Admin > On Hold
      summary: On Hold Customer Options
      parameters:
        - name: accessToken
          in: cookie
          description: The authentication cookie
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              example:
                option:
                  - title: >-
                      We have encountered an issue with one or more of the items
                      in your order. Please review the details below and confirm
                      how you would like to proceed.
                    option: >-
                      Missing or Damaged Items – Some items are missing or
                      damaged, requiring customer verification.
                    confirmationText: >-
                      Your order will proceed with the missing/damaged items as
                      acknowledged. Thank you for your confirmation!
                    notConfirmText: >-
                      We will recheck your items. Please wait while our team
                      verifies your order.
                    onHoldOptionId: 1
                  - title: >-
                      We are waiting for your confirmation regarding special
                      washing instructions for some of the items in your order.
                      Please review the details below and confirm how you would
                      like to proceed.
                    option: >-
                      Special Instructions Pending Waiting for customer
                      confirmation on delicate fabrics, stains, or special
                      washing preferences.
                    confirmationText: >-
                      Your special instructions have been received. Your laundry
                      will be processed accordingly!
                    notConfirmText: >-
                      Proceeding without special instructions may result in
                      standard washing treatment.
                    onHoldOptionId: 2
                  - title: >-
                      Your item has been flagged for possible risks (shrinking,
                      color bleeding, or pre-existing damage). Please review and
                      confirm how you would like us to proceed.
                    option: >-
                      Some items may shrink, bleed color, or have pre-existing
                      damage. Please confirm how you would like us to proceed.
                    confirmationText: >-
                      Your items will be processed with the risks acknowledged.
                      Thank you for confirming!
                    notConfirmText: >-
                      Your order contains items at risk of shrinking or damage.
                      Please approve or remove items to proceed
                    onHoldOptionId: 3
                  - title: >-
                      There is an issue with the tagging or sorting of your
                      items. Please review the details below and confirm how you
                      would like us to proceed.
                    option: >-
                      Some of your items are incorrectly tagged or mixed up.
                      Please confirm how you would like us to proceed.
                    confirmationText: >-
                      Your items have been sorted correctly. Your laundry is now
                      being processed!
                    notConfirmText: >-
                      We will manually verify and sort your items before
                      processing. Please wait for an update.
                    onHoldOptionId: 4
                  - title: >-
                      A damage liability waiver is required for high-risk items
                      before cleaning. Please review the details below and
                      confirm how you would like to proceed.
                    option: >-
                      Your items are flagged as high-risk, and a waiver is
                      required before cleaning. Please confirm your decision to
                      proceed.
                    confirmationText: >-
                      You have signed the waiver. Your items will now be
                      processed!
                    notConfirmText: >-
                      This item has been excluded from cleaning as per your
                      request.
                    onHoldOptionId: 5
                  - title: >-
                      There is an issue with your order. Please review the
                      details below and confirm how you would like to proceed
                    option: >-
                      Your order has been placed on hold for a custom reason.
                      Please review and confirm how you would like to proceed.
                    confirmationText: You have confirmed the issue. Your order will proceed.
                    notConfirmText: Would you like to clarify the issue with our support team?
                    onHoldOptionId: 6
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
