  /agent/addEmployee:
    post:
      summary: Add employee
      description: |
        Adds an employee under the authenticated agent. Sets employeeOff to the agent.
        Laundry shop driver: role name "Laundry Shop Driver" or roleId 6 — creates driverInZones when shop address/zone exists.
        Optional permissionRole replaces all permissions for the given roleId (affects every user with that role).
      tags:
        - Agent > Add Employee
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token cookie for authentication
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - roleId
              properties:
                firstName:
                  type: string
                  example: "John"
                  description: Employee's first name
                lastName:
                  type: string
                  example: "Doe"
                  description: Employee's last name
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                  description: Employee's email address
                password:
                  type: string
                  example: "SecurePass1"
                  description: Login password for the employee
                phoneNum:
                  type: string
                  example: "+1234567890"
                  description: Employee's phone number
                countryCode:
                  type: string
                  example: "+44"
                  description: Optional country calling code
                roleId:
                  type: integer
                  example: 6
                  description: Role ID (e.g. laundry shop driver)
                permissionRole:
                  type: string
                  description: |
                    Optional JSON array (stringify when using multipart). Each item uses feature id as "id".
                    Example: [{"id":12,"permissions":{"read":true,"create":false,"update":false,"delete":false}}]
                profileImage:
                  type: string
                  format: binary
                  description: Profile image file
      responses:
        '200':
          description: Employee added successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Employee added successfully"
                statusCode: 200
                data:
                  employee:
                    id: 101
                    firstName: "John"
                    lastName: "Doe"
                    email: "john.doe@example.com"
                    phoneNum: "+1234567890"
                    roleId: 6
                    classifiedAsId: 1
                    employeeOff: 55
                    status: true
                    role:
                      id: 6
                      name: "Laundry Shop Driver"
                  permissionsUpdated: false
                  roleId: 6
                error: ""

        '400':
          description: Bad request
          content:
            application/json:
              example:
                status: "0"
                message: "Invalid employee data"
                data: {}

