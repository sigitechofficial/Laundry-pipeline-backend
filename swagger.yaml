  /admin/adinEmployeeAdd:
    post:
      summary: Add new employee (Admin)
      description: Allows an admin/agent to add a new employee. If the role qualifies as a driver, the employee is also added to a zone.
      tags:
        - Admin > Employee Management
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token of the admin or agent adding the employee (sent via cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - password
                - phoneNum
                - countryId
                - cityId
                - roleId
              properties:
                firstName:
                  type: string
                  example: "Ali"
                lastName:
                  type: string
                  example: "Khan"
                email:
                  type: string
                  format: email
                  example: "ali.khan@example.com"
                password:
                  type: string
                  format: password
                  example: "StrongPass123!"
                phoneNum:
                  type: string
                  example: "+923001234567"
                countryId:
                  type: integer
                  example: 1
                cityId:
                  type: integer
                  example: 3
                roleId:
                  type: integer
                  example: 6
                  description: Role ID (e.g., 6 = driver)
      responses:
        '200':
          description: Employee added successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Employee Added Sucessfully"
                data:
                  id: 789
                  firstName: "Ali"
                  lastName: "Khan"
                  email: "ali.khan@example.com"
                  roleId: 6
                  classifiedAsId: 2
                error: ""
        '400':
          description: Employee already exists with the same role
          content:
            application/json:
              example:
                status: "0"
                message: "Employee Already Exists"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Unable to create employee"
  /admin/updateEmployee:
    patch:
      summary: Update employee details (Admin)
      description: Updates the employee’s basic details and optionally their password. Prevents duplicate emails for other employees.
      tags:
        - Admin > Employee Management
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Admin's access token (sent via cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - roleId
                - employeeId
              properties:
                employeeId:
                  type: integer
                  example: 123
                  description: ID of the employee being updated
                firstName:
                  type: string
                  example: "Ahmad"
                lastName:
                  type: string
                  example: "Yousaf"
                email:
                  type: string
                  format: email
                  example: "ahmad.yousaf@example.com"
                phoneNum:
                  type: string
                  example: "+923001112222"
                roleId:
                  type: integer
                  example: 6
                updatePassword:
                  type: string
                  format: password
                  example: "NewPass456!"
                  description: Optional new password to set
      responses:
        '200':
          description: Employee updated successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Employee Updated Sucesfully"
                data: {}
                error: ""
        '400':
          description: Email already used by another employee
          content:
            application/json:
              example:
                status: "0"
                message: "Employee with the following email exists"
                detail: "Please try another email"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Unable to update employee"
  /admin/updateEmployeeStatus:
    patch:
      summary: Update employee status (Admin)
      description: Allows an admin to activate or deactivate an employee account by toggling their `status`.
      tags:
        - Admin > Employee Management
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Admin's access token (sent via cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
                - employeeId
              properties:
                employeeId:
                  type: integer
                  example: 123
                  description: ID of the employee to update
                status:
                  type: boolean
                  example: false
                  description: New status value (`true` = active, `false` = inactive)
      responses:
        '200':
          description: Employee status updated successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Employee Status Updated"
                data: {}
                error: ""
        '400':
          description: Missing or invalid input
          content:
            application/json:
              example:
                status: "0"
                message: "Invalid employeeId or status"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Failed to update employee status"
