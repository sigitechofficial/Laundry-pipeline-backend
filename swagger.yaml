openapi: 3.0.0
info:
  title: Laundary Service App
  version: 1.0.0
servers:
  - url: http://localhost:3010
tags:
  - name: Customer
  - name: Customer > Auth
  - name: Customer > User Profile
    description: Here are user get profile and update profile routes.
  - name: Customer > Booking Management
  - name: Customer > Services
  - name: Admin
  - name: Admin > Create Services, Categories && SubCategories
  - name: Admin > Vehicle Types
  - name: Admin > Cities & Countries
  - name: Admin > zones
  - name: Admin > Admin Login
  - name: Admin > Get Laundary Shops
  - name: Admin > Cancel Booking
  - name: Admin > Machinery
  - name: Admin > Account Preferences
  - name: Admin > On Hold
  - name: Admin > Customer Management
  - name: Admin > Driver Management
  - name: Admin > Order Management
  - name: Admin > Service Management
  - name: Admin > Employee Management
  - name: Agent
  - name: Agent > Auth
  - name: Agent > Agent Shop Address
  - name: Agent > Agent Handle Booking
  - name: Agent > Agent Drivers
  - name: Agent > Add Roles,Permissions && ClassifiedAs
  - name: Agent > Add Employee
  - name: Agent > Services
  - name: Agent > Agent Put Booking On Hold
  - name: Agent > Agent Business
paths:
  /customer/registerCustomer:
    post:
      summary: Register a new customer and send OTP
      description: Registers a new customer with email, phone, and optional profile image. Sends OTP on success.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for this endpoint)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - password
                - confirmPassword
                - phoneNum
                - dvToken
                - email
                - countryId
                - cityId
              properties:
                firstName:
                  type: string
                  example: John
                  description: Customer's first name
                lastName:
                  type: string
                  example: Doe
                  description: Customer's last name
                email:
                  type: string
                  format: email
                  example: john.doe@example.com
                  description: Customer's email address
                password:
                  type: string
                  example: Pass@1234
                  description: Password for login
                confirmPassword:
                  type: string
                  example: Pass@1234
                  description: Must match the password field
                phoneNum:
                  type: string
                  example: "+1234567890"
                  description: Customer's phone number
                dvToken:
                  type: string
                  example: abcdefgh123456
                  description: Device token for notifications
                countryId:
                  type: integer
                  example: 1
                  description: ID of the customer's country
                cityId:
                  type: integer
                  example: 101
                  description: ID of the customer's city
                profileImage:
                  type: string
                  format: binary
                  description: Optional profile picture (uploaded as file)
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              example:
                status: "1"
                message: "OTP sent successfully"
                data:
                  otpId: 1234
                  userId: 5678
        '400':
          description: Bad request - missing fields or validation failed
          content:
            application/json:
              example:
                status: "0"
                message: "User with this email already exists"
                data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
  /customer/verifyOTpSignUp:
    post:
      summary: Verify customer's OTP after signup
      description: Verifies the OTP sent to a newly registered customer. Marks the user as verified if OTP is correct.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for this endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otpId
                - OTP
                - userId
              properties:
                otpId:
                  type: integer
                  example: 1234
                  description: OTP record ID returned during signup
                OTP:
                  type: string
                  example: "5678"
                  description: OTP code entered by the user
                userId:
                  type: integer
                  example: 7890
                  description: User ID of the registered customer
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              example:
                status: "1"
                message: "OTP Verified"
                data:
                  userId: 7890
        '400':
          description: Invalid OTP or OTP record not found
          content:
            application/json:
              examples:
                otpNotFound:
                  summary: OTP record not found
                  value:
                    status: "0"
                    message: "Sorry, we could not fetch the data"
                    data: {}
                incorrectOtp:
                  summary: Incorrect OTP
                  value:
                    status: "0"
                    message: "Entered Incorrect OTP. Please enter correct OTP to continue"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Something went wrong"
                data: {}
  /customer/loginUser:
    post:
      summary: Customer login (Email or Social)
      description: |
        Logs in a customer using email/password or social platforms (Google, Facebook, Apple). Returns access token in cookies.
        For a guest (no DB user), send `guestUser: true` or `isGuest: true` with optional `lat` / `lng` for zone; omit credentials.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Access token cookie (optional in login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                guestUser:
                  type: boolean
                  example: true
                  description: If true, issues guest JWT + Redis session (no email/password). Same as `isGuest`.
                isGuest:
                  type: boolean
                  example: true
                  description: Alias for `guestUser`.
                email:
                  type: string
                  format: email
                  example: johndoe@example.com
                  description: User's email address (not required for guest)
                password:
                  type: string
                  example: MySecret123!
                  description: Required for standard login; optional for social login
                signedFrom:
                  type: string
                  example: google
                  enum: [google, facebook, apple]
                  description: Indicates if login is via a social provider
                dvToken:
                  type: string
                  example: device-token-xyz
                  description: Device token for registered login (optional for guest)
                lat:
                  type: number
                  description: Optional; with `lng`, zone is included in login response
                lng:
                  type: number
                  description: Optional; with `lat`, zone is included in login response
      responses:
        '200':
          description: Login successful or user verification pending
          content:
            application/json:
              examples:
                loginSuccess:
                  summary: Standard login success
                  value:
                    status: "1"
                    message: "Login successful"
                    data:
                      userId: 123
                      token: "jwt_token"
                socialLoginRedirect:
                  summary: Social login required
                  value:
                    status: "4"
                    message: "Social Login Required"
                    data: {}
                    detail: "You have previously signed up using google. Please log in using google."
                otpVerificationPending:
                  summary: OTP verification required
                  value:
                    status: "2"
                    message: "Pending email verification"
                    data:
                      userId: 123
                      otpId: 456
                      email: johndoe@example.com
                    detail: "Please verify your email to continue"
                profileIncomplete:
                  summary: Missing user data
                  value:
                    status: "3"
                    message: "Pending User Data"
                    data:
                      userId: 123
                    detail: "Your first Name or Phone Number is Missing"
        '400':
          description: Bad request or invalid credentials
          content:
            application/json:
              examples:
                userNotFound:
                  summary: User not found
                  value:
                    status: "0"
                    message: "User Not Exists with this email"
                    data: {}
                wrongPassword:
                  summary: Invalid password
                  value:
                    status: "0"
                    message: "Bad credentials"
                    detail: "Please enter correct password to continue"
                    data: {}
                blockedUser:
                  summary: User is blocked
                  value:
                    status: "0"
                    message: "Blocked by admin Please contact admin to continue"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
  /customer/forgetPasswordRequest:
     post:
      summary: Request OTP for password reset
      description: Sends an OTP to the user's email for password reset. Updates existing OTP if already present.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for this endpoint)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  example: customer@example.com
                  description: Email address of the customer requesting password reset
      responses:
        '200':
          description: OTP sent or updated successfully
          content:
            application/json:
              examples:
                otpUpdated:
                  summary: OTP updated
                  value:
                    status: "1"
                    message: "OTP Updated Sucessfully"
                    data:
                      otpid: 234
                      userId: 567
                otpSent:
                  summary: OTP sent
                  value:
                    status: "1"
                    message: "OTP sent Sucessfully for Password Reset"
                    data:
                      otpId: 123
                      userId: 567
        '400':
          description: Invalid email or user not found
          content:
            application/json:
              example:
                status: "0"
                message: "Invalid information"
                detail: "No user exists against this email"
                data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Error in updating OTP"
                data: {}
  /customer/verifyOTPforPassword:
    post:
      summary: Verify OTP for password reset
      description: Verifies the OTP sent to the user's email during the password reset process.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for OTP verification)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - otpId
                - OTP
              properties:
                otpId:
                  type: integer
                  example: 123
                  description: ID of the OTP record
                OTP:
                  type: string
                  example: "5678"
                  description: OTP sent to the user's email
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              example:
                status: "1"
                message: "OTP verified"
                data:
                  otpId: 123
                  userId: 456
        '400':
          description: OTP is incorrect or OTP record not found
          content:
            application/json:
              examples:
                otpNotFound:
                  summary: OTP record not found
                  value:
                    status: "0"
                    message: "Sorry, we could not fetch the data"
                    detail: "Please rensend OTP to continue"
                    data: {}
                incorrectOtp:
                  summary: Incorrect OTP
                  value:
                    status: "0"
                    message: "You entered incorrect OTP Please enter correct OTP to continue"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
  /customer/changePasswordOTP:
     post:
      summary: Change password using OTP
      description: Allows the user to reset their password after verifying an OTP. OTP must be verified before calling this.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: false
          schema:
            type: string
          description: Optional access token cookie (not required for password change via OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - otpId
                - password
              properties:
                userId:
                  type: integer
                  example: 456
                  description: ID of the user who is resetting the password
                otpId:
                  type: integer
                  example: 123
                  description: ID of the OTP that was verified
                password:
                  type: string
                  format: password
                  example: NewPassword@123
                  description: New password to set for the user
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Password updated successfully. Please login to continue"
                data: {}
        '400':
          description: OTP verification missing or invalid data
          content:
            application/json:
              examples:
                otpNotVerified:
                  summary: OTP not verified
                  value:
                    status: "0"
                    message: "OTP not verified yet"
                    detail: "Please verify OTP first"
                    data: {}
                otpNotFound:
                  summary: OTP record not found
                  value:
                    status: "0"
                    message: "Sorry, we could not fetch the data"
                    detail: "Please rensend OTP to continue"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
  /customer/logout:
    get:
      summary: Logout user
      description: Logs out the user by removing their device token and clearing their session from Redis.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token identifying the session to be logged out (sent in cookie)
      responses:
        '200':
          description: Logout success
          content:
            application/json:
              example:
                status: "1"
                message: "Log-out successfully"
                data: {}
                error: ""
        '500':
          description: Internal server error during logout
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "There is some error logging out. Please try again"
  /customer/session:
    get:
      summary: Get user session details
      description: Returns authenticated user's session details. Throws an error if guest access is detected or user is blocked.
      tags:
        - Customer > Auth
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token identifying the user session (required)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                guestUser:
                  type: boolean
                  example: false
                  description: Optional flag to indicate guest access (should be false)
      responses:
        '200':
          description: Session retrieved successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Login successful"
                data:
                  user:
                    id: 123
                    firstName: John
                    lastName: Doe
                    email: john@example.com
                    phoneNum: "+123456789"
                    countryCode: "+1"
                  accessToken: ""
                  guestUser: false
        '400':
          description: Guest login attempt or user not found
          content:
            application/json:
              examples:
                guestUser:
                  summary: Guest login blocked
                  value:
                    status: "0"
                    message: "Login failed"
                    data: {}
                noUserFound:
                  summary: User not found
                  value:
                    status: "0"
                    message: "Sorry no user found!"
                    detail: "Please contact support for more information"
                    data: {}
                blockedUser:
                  summary: User is blocked
                  value:
                    status: "0"
                    message: "You are blocked by Admin"
                    detail: "Please contact support for more information"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
  /customer/guest/start:
    post:
      summary: Start guest session (no DB user)
      description: Issues a guest JWT and stores a Redis session. Same cookie path as customer login (/customer). Guest tokens are not accepted by registered-user routes (validateAccessToken).
      tags:
        - Customer > Auth
      responses:
        '200':
          description: Guest token issued
          content:
            application/json:
              example:
                status: "1"
                message: "Guest session started"
                statusCode: 200
                data:
                  userId: ""
                  isGuest: true
                  accessToken: "<jwt>"
                error: ""
  /customer/guest/session:
    get:
      summary: Guest session details
      description: Returns stub user fields for an active guest session (requires guest JWT + Redis).
      tags:
        - Customer > Auth
      parameters:
        - in: header
          name: accesstoken
          required: false
          schema:
            type: string
          description: Guest JWT (or cookie accessToken)
      responses:
        '200':
          description: Guest session active
        '403':
          description: Invalid or expired guest session
  /customer/guest/logout:
    get:
      summary: Guest logout
      description: Removes the guest session from Redis (JWT may still decode until expiry but is rejected without Redis).
      tags:
        - Customer > Auth
      parameters:
        - in: header
          name: accesstoken
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Logout success
  /customer/getUserProfile:
     get:
      summary: Fetch logged-in user profile
      description: Retrieves the profile details of the currently authenticated user.
      tags:
        - Customer > User Profile
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token for identifying the logged-in user
      responses:
        '200':
          description: User profile fetched successfully
          content:
            application/json:
              example:
                status: "1"
                message: "User Profile fetched"
                data:
                  id: 123
                  firstName: "John"
                  lastName: "Doe"
                  email: "john@example.com"
                  phoneNum: "+123456789"
                  image: "Public/Images/Restaurant/user123.jpg"
                  userTypeId: 2
                  stripeCustomerId: "cus_ABC123"
                error: ""
        '400':
          description: User not found
          content:
            application/json:
              example:
                status: "0"
                message: "No User Exists with this email"
                data: {}
                error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: ""
  /customer/updateUserProfile:
    patch:
      summary: Update user profile
      description: Updates profile information of the logged-in user. Profile image is required only if `isProfileImgChanged` is `true`.
      tags:
        - Customer > User Profile
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Access token identifying the authenticated user (required)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - email
                - phoneNum
                - isProfileImgChanged
              properties:
                firstName:
                  type: string
                  example: "John"
                  description: User's first name
                lastName:
                  type: string
                  example: "Doe"
                  description: User's last name
                email:
                  type: string
                  format: email
                  example: "john.doe@example.com"
                  description: User's email address
                phoneNum:
                  type: string
                  example: "+123456789"
                  description: User's phone number
                isProfileImgChanged:
                  type: string
                  enum: ["true", "false"]
                  example: "true"
                  description: Indicates whether the profile image is being updated
                profileImage:
                  type: string
                  format: binary
                  description: New profile image file (only required if `isProfileImgChanged` is `"true"`)
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              example:
                status: "1"
                message: "User Profile Updated Sucessfully"
                data: {}
                error: ""
        '400':
          description: Validation or input error
          content:
            application/json:
              examples:
                userNotFound:
                  summary: User not found
                  value:
                    status: "0"
                    message: "user Not Exists with this ID"
                    data: {}
                    error: ""
                imageRequired:
                  summary: Profile image missing when required
                  value:
                    status: "0"
                    message: "Profile Image Required"
                    data: {}
                    error: ""
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: ""
  /customer/createBooking:
    post:
      summary: Create a new booking
      description: Creates a booking with pickup, drop-off, services, and preferences. Validates addresses, calculates charges, and triggers billing and event flows.
      tags:
        - Customer > Booking Management
      parameters:
        - in: cookie
          name: accessToken
          required: true
          schema:
            type: string
          description: Authenticated access token (required in cookie)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - collectionDate
                - collectionTimeFrom
                - collectionTimeTo
                - deliveryDate
                - deliveryTimeFrom
                - deliveryTimeTo
                - pickUpAddress
                - dropOffAddress
                - dropOffSamePickUp
                - services
                - totalItems
              properties:
                collectionDate:
                  type: string
                  format: date
                  example: "2025-05-22"
                  description: Date when items will be picked up
                collectionTimeFrom:
                  type: string
                  example: "09:00"
                  description: Start time for pickup
                collectionTimeTo:
                  type: string
                  example: "10:00"
                  description: End time for pickup
                deliveryDate:
                  type: string
                  format: date
                  example: "2025-05-23"
                  description: Delivery date for the items
                deliveryTimeFrom:
                  type: string
                  example: "13:00"
                  description: Start time for delivery
                deliveryTimeTo:
                  type: string
                  example: "14:00"
                  description: End time for delivery
                driverInstruction:
                  type: string
                  example: "Please ring the doorbell"
                  description: Optional driver instructions
                frequency:
                  type: string
                  example: "One-time"
                  description: Booking frequency (if any)
                dropOffSamePickUp:
                  type: boolean
                  example: true
                  description: If true, drop-off address is same as pickup
                pickUpAddress:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat:
                      type: number
                      example: 25.276987
                    lng:
                      type: number
                      example: 55.296249
                dropOffAddress:
                  type: object
                  required: [lat, lng]
                  properties:
                    lat:
                      type: number
                      example: 25.204849
                    lng:
                      type: number
                      example: 55.270782
                addNewAddress:
                  type: object
                  description: Optional new address info for pickup
                addNewDropOffAddress:
                  type: object
                  description: Optional new address info for drop-off
                pickUpAddressId:
                  type: integer
                  example: 101
                  description: Existing address ID if not adding new pickup address
                dropOffAddressId:
                  type: integer
                  example: 202
                  description: Existing address ID if not adding new drop-off address
                addressId:
                  type: integer
                  example: 105
                  description: Legacy/optional address ID for tracking
                totalItems:
                  type: integer
                  example: 3
                  description: Total number of items in the order
                services:
                  type: array
                  minItems: 1
                  description: List of selected service entries
                  items:
                    type: object
                    required: [serviceId]
                    properties:
                      serviceId:
                        type: integer
                        example: 1
                      categoryId:
                        type: integer
                        example: 2
                      subCategoryId:
                        type: integer
                        example: 4
                      categoryCharge:
                        type: number
                        example: 25.00
                driverInstructionOptions:
                  type: string
                  example: "Leave at the door"
                  description: Optional preset driver instruction
                driverInstructionOptions1:
                  type: string
                  example: "Call on arrival"
                  description: Optional additional instruction
                preferencesArray:
                  type: array
                  description: List of preferences to apply per service
                  items:
                    type: object
                    required: [type, chooseTemperature, serviceId, preferencesServiceNameId, numberOfBags]
                    properties:
                      type:
                        type: string
                        example: "Wash"
                      chooseTemperature:
                        type: string
                        example: "Cold"
                      serviceId:
                        type: integer
                        example: 3
                      preferencesServiceNameId:
                        type: integer
                        example: 5
                      numberOfBags:
                        type: integer
                        example: 2
      responses:
        '200':
          description: Booking created successfully
          content:
            application/json:
              example:
                status: "1"
                message: "Booking Created"
                data: {}
                error: ""
        '400':
          description: Missing or invalid input
          content:
            application/json:
              examples:
                noServiceSelected:
                  summary: No services provided
                  value:
                    status: "0"
                    message: "Cannot Continue without Selection of Service Types"
                    detail: "Select Minimum one Service Type"
                    data: {}
        '500':
          description: Internal server error
          content:
            application/json:
              example:
                status: "0"
                message: "Internal server error"
                data: {}
                error: "Something went wrong while processing booking"
  /customer/onHoldCustomerShow:
    get:
      summary: Show on-hold customer response
