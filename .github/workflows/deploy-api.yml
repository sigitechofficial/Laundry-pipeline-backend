# Careflow-style SSH deploy for Laundry API (no FTP).
# main  → prodlaundry + PM2 laundary
# stage → stagelaundry + PM2 laundary-stage
name: Deploy Laundry API

on:
  # Auto-deploy stage + production on push (same as Careflow).
  push:
    branches: [stage, main]
    paths-ignore:
      - '.github/workflows/sync-live-to-stage-db.yml'
      - '.github/workflows/pre-migration-backup.yml'
      - '.github/workflows/pre-migration-backup-ftp.yml'
      - 'deploy/PRE_MIGRATION_BACKUP.md'
  workflow_dispatch:

concurrency:
  group: laundry-api-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Package API release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate package
        run: |
          set -euo pipefail
          test -f laundary.js
          test -f package.json
          test -f package-lock.json
          test -d migrations
          test -d models
          test -d controllers
          test -f scripts/remote-deploy-api.sh
          test -f scripts/run-deploy-seeds.sh
          chmod +x scripts/remote-deploy-api.sh scripts/run-deploy-seeds.sh

      - name: Install and test
        run: |
          npm ci
          npm test

      - name: Create release metadata
        run: |
          cat > release.json <<EOF
          {
            "app": "laundry-api",
            "commit": "${{ github.sha }}",
            "shortCommit": "$(echo '${{ github.sha }}' | cut -c1-8)",
            "branch": "${{ github.ref_name }}",
            "deployedBy": "${{ github.actor }}",
            "runId": "${{ github.run_id }}",
            "runNumber": "${{ github.run_number }}",
            "packagedAt": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Package release (no node_modules / secrets)
        run: |
          set -euo pipefail
          # Write outside the tree so GNU tar does not fail with
          # "file changed as we read it" while packing `.`.
          # Exclude Public (user media, ~300MB in git) — preserved on VPS via rsync.
          tar -czf /tmp/laundry-api-release.tar.gz \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./uploads' \
            --exclude='./Public' \
            --exclude='./backups' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./config/config.json' \
            --exclude='./firebase.json' \
            --exclude='./examples' \
            --exclude='./graphify-out' \
            --exclude='./.careflow-review' \
            --exclude='./*.log' \
            --exclude='./*.tar.gz' \
            -C "$GITHUB_WORKSPACE" .
          mv /tmp/laundry-api-release.tar.gz "$GITHUB_WORKSPACE/laundry-api-release.tar.gz"
          test -s laundry-api-release.tar.gz
          ls -lh laundry-api-release.tar.gz
          # sanity: entrypoint + deploy script inside archive (no | head — pipefail/SIGPIPE)
          tar -tzf laundry-api-release.tar.gz | grep -E '(^|/)laundary\.js$' >/dev/null
          tar -tzf laundry-api-release.tar.gz | grep -E '(^|/)scripts/remote-deploy-api\.sh$' >/dev/null
          echo "Package OK ($(du -h laundry-api-release.tar.gz | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: laundry-api-release
          path: |
            laundry-api-release.tar.gz
            scripts/remote-deploy-api.sh
          retention-days: 7

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laundry-api-release

      - name: Resolve target env
        id: target
        run: |
          set -euo pipefail
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "live_path=/home/sigisolutions/prodlaundry.sigisolutions.net" >> "$GITHUB_OUTPUT"
            echo "app_url=https://prodlaundry.sigisolutions.net/" >> "$GITHUB_OUTPUT"
            echo "pm2=laundary" >> "$GITHUB_OUTPUT"
            echo "deploy_root=/home/sigisolutions/deployments/laundry-api" >> "$GITHUB_OUTPUT"
            echo "app_name=laundry-api" >> "$GITHUB_OUTPUT"
          else
            echo "live_path=/home/sigisolutions/stagelaundry.sigisolutions.net" >> "$GITHUB_OUTPUT"
            echo "app_url=https://stagelaundry.sigisolutions.net/" >> "$GITHUB_OUTPUT"
            echo "pm2=laundary-stage" >> "$GITHUB_OUTPUT"
            echo "deploy_root=/home/sigisolutions/deployments/laundry-api-stage" >> "$GITHUB_OUTPUT"
            echo "app_name=laundry-api-stage" >> "$GITHUB_OUTPUT"
          fi

      # Firebase Admin credential of the PRIMARY project (secret FIREBASE_SERVICE_ACCOUNT_JSON,
      # the service-account JSON) and its RTDB URL (variable FIREBASE_DATABASE_URL), per
      # environment. Both unset: the server's Firebase config is left as is.
      # The key never travels through step outputs or remote environment variables (they leak
      # into process argv / PM2 dumps): it is written to a 600 file here, copied by scp into a
      # 700 drop directory on the server, consumed by scripts/firebase-server-credentials.sh
      # (installed as secrets/firebase/primary.json, 600) and shredded. The deploy only receives
      # the drop file's PATH. The RTDB URL must point at an existing instance: deploying before
      # the database exists would make every live-tracking request wait on RTDB timeouts.
      - name: Prepare Firebase credential
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ vars.FIREBASE_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_JSON not set for this environment: server Firebase config left as is"
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          mkdir -p firebase-credential-upload
          chmod 700 firebase-credential-upload
          OUT=firebase-credential-upload/firebase-primary.json node -e '
            (async () => {
              let j;
              try { j = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT_JSON); } catch (e) { console.error("FIREBASE_SERVICE_ACCOUNT_JSON is not valid JSON"); process.exit(1); }
              for (const k of ["project_id", "client_email", "private_key"]) if (typeof j[k] !== "string" || !j[k]) { console.error("FIREBASE_SERVICE_ACCOUNT_JSON has no " + k); process.exit(1); }
              const url = (process.env.FIREBASE_DATABASE_URL || "").trim().replace(/\/+$/, "");
              if (!/^https:\/\/\S+$/.test(url) || !url.includes(j.project_id)) { console.error("Set variable FIREBASE_DATABASE_URL to " + j.project_id + "\u0027s RTDB URL"); process.exit(1); }
              // Unauthenticated shallow read: an existing (locked) instance answers 401/403, a
              // missing one 404. Refuse to point the server at a database that does not exist.
              let status = 0;
              try { status = (await fetch(url + "/.json?shallow=true", { signal: AbortSignal.timeout(15000) })).status; } catch (e) { console.error("RTDB " + url + " unreachable: " + e.message); process.exit(1); }
              if (status === 404) { console.error("RTDB " + url + " does not exist (HTTP 404). Create it (scripts/provisionLiveTrackingRtdb.js) before setting FIREBASE_DATABASE_URL."); process.exit(1); }
              require("fs").writeFileSync(process.env.OUT, JSON.stringify(j), { mode: 0o600 });
              console.log("Firebase primary project: " + j.project_id + " rtdb=" + url + " (HTTP " + status + ")");
            })();
          '
          chmod 600 firebase-credential-upload/firebase-primary.json
          echo "present=true" >> "$GITHUB_OUTPUT"

      - name: Upload release + deploy script (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 30m
          source: laundry-api-release.tar.gz,scripts/remote-deploy-api.sh
          target: ${{ steps.target.outputs.deploy_root }}/incoming/
          overwrite: true
          strip_components: 0

      # Private (700) drop directory for the credential file, created before scp writes into it.
      - name: Prepare Firebase credential drop directory
        if: steps.firebase.outputs.present == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ROOT: ${{ steps.target.outputs.deploy_root }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          envs: DEPLOY_ROOT
          script: |
            set -euo pipefail
            umask 077
            mkdir -p "$DEPLOY_ROOT/secrets/firebase/incoming"
            chmod 700 "$DEPLOY_ROOT/secrets" "$DEPLOY_ROOT/secrets/firebase" "$DEPLOY_ROOT/secrets/firebase/incoming"

      - name: Upload Firebase credential (SCP, 600 file in 700 directory)
        if: steps.firebase.outputs.present == 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          source: firebase-credential-upload/firebase-primary.json
          target: ${{ steps.target.outputs.deploy_root }}/secrets/firebase/incoming/
          tar_tmp_path: ${{ steps.target.outputs.deploy_root }}/secrets/firebase/incoming/
          overwrite: true
          strip_components: 1

      - name: Remove local Firebase credential copy
        if: always()
        run: rm -rf firebase-credential-upload

      - name: Rename incoming package + run remote deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE_ID: ${{ github.sha }}
          LIVE_PATH: ${{ steps.target.outputs.live_path }}
          APP_URL: ${{ steps.target.outputs.app_url }}
          PM2_APP_NAME: ${{ steps.target.outputs.pm2 }}
          DEPLOY_ROOT: ${{ steps.target.outputs.deploy_root }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          OPS_CONTROL_TOKEN: ${{ secrets.OPS_CONTROL_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_FILE: ${{ steps.firebase.outputs.present == 'true' && format('{0}/secrets/firebase/incoming/firebase-primary.json', steps.target.outputs.deploy_root) || '' }}
          FIREBASE_DATABASE_URL_VALUE: ${{ vars.FIREBASE_DATABASE_URL }}
          FIREBASE_LEGACY_DATABASE_URL_VALUE: ${{ vars.FIREBASE_LEGACY_DATABASE_URL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          command_timeout: 55m
          envs: RELEASE_ID,LIVE_PATH,APP_URL,PM2_APP_NAME,DEPLOY_ROOT,APP_NAME,GITHUB_RUN_NUMBER,GITHUB_RUN_ID,GITHUB_ACTOR,GITHUB_REF_NAME,OPS_CONTROL_TOKEN,FIREBASE_SERVICE_ACCOUNT_FILE,FIREBASE_DATABASE_URL_VALUE,FIREBASE_LEGACY_DATABASE_URL_VALUE
          script: |
            set -euo pipefail
            export HOME=/home/sigisolutions
            source "$HOME/.nvm/nvm.sh" 2>/dev/null || true

            mkdir -p "$DEPLOY_ROOT/incoming" "$DEPLOY_ROOT/releases" "$DEPLOY_ROOT/backups" "$DEPLOY_ROOT/db-backups" "$DEPLOY_ROOT/logs"

            # scp may drop files with nested path; normalize to incoming/<sha>.tar.gz
            if [ -f "$DEPLOY_ROOT/incoming/laundry-api-release.tar.gz" ]; then
              mv -f "$DEPLOY_ROOT/incoming/laundry-api-release.tar.gz" "$DEPLOY_ROOT/incoming/${RELEASE_ID}.tar.gz"
            elif [ -f "$DEPLOY_ROOT/incoming/${RELEASE_ID}.tar.gz" ]; then
              true
            else
              # search one level down
              found="$(find "$DEPLOY_ROOT/incoming" -name 'laundry-api-release.tar.gz' | head -n1 || true)"
              if [ -n "$found" ]; then
                mv -f "$found" "$DEPLOY_ROOT/incoming/${RELEASE_ID}.tar.gz"
              else
                echo "Release tarball not found under $DEPLOY_ROOT/incoming"
                find "$DEPLOY_ROOT/incoming" -maxdepth 3 -type f | head
                exit 1
              fi
            fi

            SCRIPT="$(find "$DEPLOY_ROOT/incoming" -name 'remote-deploy-api.sh' | head -n1 || true)"
            if [ -z "$SCRIPT" ]; then
              SCRIPT="$DEPLOY_ROOT/remote-deploy-api.sh"
            fi
            if [ ! -f "$SCRIPT" ]; then
              echo "remote-deploy-api.sh missing"
              exit 1
            fi
            cp "$SCRIPT" "$DEPLOY_ROOT/remote-deploy-api.sh"
            chmod +x "$DEPLOY_ROOT/remote-deploy-api.sh"

            export RELEASE_ID LIVE_PATH APP_URL PM2_APP_NAME DEPLOY_ROOT APP_NAME
            export GITHUB_RUN_NUMBER GITHUB_RUN_ID GITHUB_ACTOR GITHUB_REF_NAME
            export OPS_CONTROL_TOKEN
            export FIREBASE_SERVICE_ACCOUNT_FILE FIREBASE_DATABASE_URL_VALUE FIREBASE_LEGACY_DATABASE_URL_VALUE
            bash "$DEPLOY_ROOT/remote-deploy-api.sh"
