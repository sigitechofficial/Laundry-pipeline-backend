name: CI/CD Workflow

on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20.19.6

    steps:
      - uses: actions/checkout@v2

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: |
          echo "Creating .env file..."
          echo "${{ secrets.ENV_FILE_CONTENT_PROD }}" > .env

      - name: Create config folder and files
        run: |
          echo "Creating config folder..."
          mkdir -p config
          cat << 'EOF' > config/config.json
          ${{ secrets.CONFIG_JSON_CONTENT_PROD }}
          EOF

      # bash: echo "…$1…" strips $1 — use env + printf so RewriteRule $1 survives
      - name: Create .htaccess file
        env:
          HTACCESS_CONTENT: ${{ secrets.HTACCESS_CONTENT_PROD }}
        run: |
          printf '%s\n' "$HTACCESS_CONTENT" > .htaccess

      - name: Creating firebase.json file
        run: |
          echo "Creating firebase.json..."
          echo "${{ secrets.FIREBASE_CONTENT_PROD }}" > firebase.json

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sigisolutions.net
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**

      - name: Trigger npm install on server
        run: |
          echo "Triggering npm install via PHP script..."
          curl -X GET "https://prodlaundry.sigisolutions.net/trigger.php"
        env:
          HOME: /home/sigisolutions

  deploy_stage:
    needs: build
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: |
          echo "Creating .env file..."
          echo "${{ secrets.ENV_FILE_CONTENT_STAGE }}" > .env

      - name: Create config folder and files
        run: |
          echo "Creating config folder..."
          mkdir -p config
          cat << 'EOF' > config/config.json
          ${{ secrets.CONFIG_JSON_CONTENT_STAGE }}
          EOF

      - name: Create .htaccess file
        run: |
          echo "Creating .htaccess file..."
          echo "${{ secrets.HTACCESS_CONTENT_STAGE }}" > .htaccess

      - name: Creating firebase.json file
        run: |
          echo "Creating firebase.json..."
          echo "${{ secrets.FIREBASE_CONTENT_STAGE }}" > firebase.json

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sigisolutions.net
          username: ${{ secrets.STAGE_FTP_USERNAME }}
          password: ${{ secrets.STAGE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**

      # Stage TLS cert is expired (prod is fine). Use -k until renewed.
      # Hosting sends all traffic to PM2/Express, so /stage-trigger.php is handled
      # by Express in laundary.js (same npm install + pm2 restart as stage-trigger.php).
      # ONE-TIME after this lands: pm2 restart laundary-stage so the new route loads.
      - name: Trigger npm install on stage server
        run: |
          echo "Triggering stage deploy via /stage-trigger.php (Express handler)..."
          body="$(curl -k -sS --max-time 600 -X GET "https://stagelaundry.sigisolutions.net/stage-trigger.php")"
          echo "$body"
          if echo "$body" | grep -qiE 'NPM install completed|PM2 command completed|PM2 command scheduled'; then
            echo "Stage trigger succeeded"
          else
            echo "Stage trigger failed."
            echo "If this is the first deploy of the Express /stage-trigger.php route, SSH once and run:"
            echo "  source /home/sigisolutions/.nvm/nvm.sh && pm2 restart laundary-stage"
            echo "Then re-run this workflow."
            exit 1
          fi
        env:
          HOME: /home/sigisolutions
