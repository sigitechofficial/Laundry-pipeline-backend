name: CI/CD Workflow

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:18.20.4
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Basic check
        run: |
          node -v
          npm -v

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout latest code
        uses: actions/checkout@v4

      # ---------------- ENV FILE ----------------
      - name: 🔐 Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV_FILE_CONTENT_PROD }}
          EOF

      # ---------------- CONFIG JSON ----------------
      - name: 📁 Create config/config.json
        run: |
          mkdir -p config
          cat << 'EOF' > config/config.json
          ${{ secrets.CONFIG_JSON_CONTENT_PROD }}
          EOF

      # ---------------- HTACCESS ----------------
      - name: 🧾 Create .htaccess
        run: |
          cat << 'EOF' > .htaccess
          ${{ secrets.HTACCESS_CONTENT_PROD }}
          EOF

      # ---------------- FIREBASE ----------------
      - name: 🔥 Create firebase.json
        run: |
          cat << 'EOF' > firebase.json
          ${{ secrets.FIREBASE_CONTENT_PROD }}
          EOF

      # ---------------- FTP DEPLOY ----------------
      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ftp.sigisolutions.net
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          timeout: 360
          
      # ---------------- TRIGGER SERVER ----------------
      - name: 🔄 Trigger npm install & PM2
        run: |
          echo "Triggering server build..."
          curl -X GET "https://laundaryb.sigisolutions.net/trigger.php"
