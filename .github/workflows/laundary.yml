name: CI/CD Workflow

on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: node:20.19.6

    steps:
      - uses: actions/checkout@v2

  deploy_main:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: |
          echo "Creating .env file..."
          echo "${{ secrets.ENV_FILE_CONTENT_PROD }}" > .env

      - name: Create config folder and files
        run: |
          echo "Creating config folder..."
          mkdir -p config
          cat << 'EOF' > config/config.json
          ${{ secrets.CONFIG_JSON_CONTENT_PROD }}
          EOF

      # bash: echo "…$1…" strips $1 — use env + printf so RewriteRule $1 survives
      - name: Create .htaccess file
        env:
          HTACCESS_CONTENT: ${{ secrets.HTACCESS_CONTENT_PROD }}
        run: |
          printf '%s\n' "$HTACCESS_CONTENT" > .htaccess

      - name: Creating firebase.json file
        run: |
          echo "Creating firebase.json..."
          echo "${{ secrets.FIREBASE_CONTENT_PROD }}" > firebase.json

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sigisolutions.net
          username: ${{ secrets.PROD_FTP_USERNAME }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**

      - name: Trigger npm install on server
        run: |
          echo "Triggering npm install via PHP script..."
          curl -X GET "https://prodlaundry.sigisolutions.net/trigger.php"
        env:
          HOME: /home/sigisolutions

  deploy_stage:
    needs: build
    if: github.ref == 'refs/heads/stage'
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: Create .env file dynamically
        run: |
          echo "Creating .env file..."
          echo "${{ secrets.ENV_FILE_CONTENT_STAGE }}" > .env

      - name: Create config folder and files
        run: |
          echo "Creating config folder..."
          mkdir -p config
          cat << 'EOF' > config/config.json
          ${{ secrets.CONFIG_JSON_CONTENT_STAGE }}
          EOF

      # Stage app is Node/Passenger; without exclusions, /stage-trigger.php is
      # proxied to Express and returns 404. Keep secret htaccess, then ensure
      # PHP deploy triggers bypass Passenger/Node (stage only — not prod).
      - name: Create .htaccess file
        env:
          HTACCESS_CONTENT: ${{ secrets.HTACCESS_CONTENT_STAGE }}
        run: |
          printf '%s\n' "$HTACCESS_CONTENT" > .htaccess
          python3 << 'PY'
          from pathlib import Path

          path = Path(".htaccess")
          text = path.read_text()

          bypass = """
          # BEGIN stage PHP deploy-trigger bypass (CI)
          <FilesMatch "^(stage-trigger|trigger)\\.php$">
            PassengerEnabled off
          </FilesMatch>
          # END stage PHP deploy-trigger bypass (CI)
          """
          if "stage PHP deploy-trigger bypass" not in text:
              text = text.rstrip() + "\n" + bypass

          cond = r'RewriteCond %{REQUEST_URI} !^/(stage-trigger|trigger)\.php$ [NC]'
          if cond not in text:
              lines = text.splitlines()
              out = []
              inserted = False
              for line in lines:
                  if (not inserted) and line.strip().startswith("RewriteRule"):
                      out.append(cond)
                      inserted = True
                  out.append(line)
              text = "\n".join(out) + "\n"

          path.write_text(text if text.endswith("\n") else text + "\n")
          print("--- .htaccess (stage) ---")
          print(path.read_text())
          PY

      - name: Creating firebase.json file
        run: |
          echo "Creating firebase.json..."
          echo "${{ secrets.FIREBASE_CONTENT_STAGE }}" > firebase.json

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sigisolutions.net
          username: ${{ secrets.STAGE_FTP_USERNAME }}
          password: ${{ secrets.STAGE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**

      # Stage TLS cert is currently expired (prod cert is valid). Use -k so CI
      # can still hit stage-trigger.php like main hits trigger.php. Renew the
      # stagelaundry.sigisolutions.net certificate, then remove -k.
      - name: Trigger npm install on stage server
        run: |
          echo "Triggering npm install via PHP script..."
          body="$(curl -k -sS -X GET "https://stagelaundry.sigisolutions.net/stage-trigger.php")"
          echo "$body"
          if echo "$body" | grep -qiE 'NPM install completed|PM2 command completed'; then
            echo "Stage trigger succeeded"
          else
            echo "Stage trigger failed: PHP script did not run (still routed to Node/Express?)"
            exit 1
          fi
        env:
          HOME: /home/sigisolutions
