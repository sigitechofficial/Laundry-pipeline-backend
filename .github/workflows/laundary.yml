# DEPRECATED: FTP deploy replaced by Careflow-style SSH workflow `deploy-api.yml`.
# Kept as manual emergency only — do not use for normal deploys.
name: Legacy FTP Deploy (DEPRECATED)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type USE_LEGACY_FTP to run the old FTP pipeline'
        required: true
        type: string

jobs:
  blocked_unless_confirmed:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "USE_LEGACY_FTP" ]; then
            echo "FTP deploy is deprecated. Use Actions → Deploy Laundry API (SSH)."
            exit 1
          fi
          echo "Legacy FTP path intentionally not auto-invoked from this stub."
          echo "If you must use FTP, restore .github/workflows/laundary.yml.ftp-backup from git history."
          exit 1
