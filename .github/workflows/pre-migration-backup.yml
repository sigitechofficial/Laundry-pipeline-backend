# One-shot (or repeatable) full backup of stage+prod code and MySQL
# BEFORE switching Laundry to Careflow-style deploy.
#
# Does NOT modify live code or databases (read-only dumps + tar).
# Uses SSH only (no FTP) — same transport style as Careflow.
name: Pre-migration full backup (stage+prod)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type BACKUP to confirm'
        required: true
        type: string

concurrency:
  group: laundry-pre-migration-backup
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backup:
    name: Snapshot stage + prod code and DBs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Confirm
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "BACKUP" ]; then
            echo "Blocked. Type BACKUP in the confirmation field."
            exit 1
          fi

      - name: Checkout (backup script)
        uses: actions/checkout@v4

      - name: Upload backup script over SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: scripts/pre-migration-full-backup.sh
          target: /home/sigisolutions/deployments/laundry-pre-migration-backups/
          overwrite: true
          strip_components: 1

      - name: Run full backup over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 75m
          script: |
            set -euo pipefail
            export HOME=/home/sigisolutions
            source "$HOME/.nvm/nvm.sh" 2>/dev/null || true

            PROD_ROOT=/home/sigisolutions/prodlaundry.sigisolutions.net
            STAGE_ROOT=/home/sigisolutions/stagelaundry.sigisolutions.net
            BACKUP_ROOT=/home/sigisolutions/deployments/laundry-pre-migration-backups
            SCRIPT="$BACKUP_ROOT/pre-migration-full-backup.sh"

            mkdir -p "$BACKUP_ROOT" "$STAGE_ROOT/scripts" "$PROD_ROOT/scripts"
            test -f "$SCRIPT"
            chmod +x "$SCRIPT"
            cp "$SCRIPT" "$STAGE_ROOT/scripts/pre-migration-full-backup.sh"
            cp "$SCRIPT" "$PROD_ROOT/scripts/pre-migration-full-backup.sh"

            echo "Paths:"
            ls -ld "$PROD_ROOT" "$STAGE_ROOT" || true
            ls -ld /home/sigisolutions/*laundry* 2>/dev/null || true
            ls -lh "$SCRIPT"

            bash "$SCRIPT"

            echo "==== LATEST POINTER ===="
            cat "$BACKUP_ROOT/LATEST.txt"
            LATEST="$(cat "$BACKUP_ROOT/LATEST.txt")"
            echo "==== MANIFEST ===="
            cat "$BACKUP_ROOT/$LATEST/MANIFEST.txt"
            echo "==== FILE SIZES ===="
            du -sh "$BACKUP_ROOT/$LATEST"/* || true
            find "$BACKUP_ROOT/$LATEST" -type f -exec ls -lh {} \;
