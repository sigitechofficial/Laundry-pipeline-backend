# Live MySQL → Stage MySQL (stage overwrite only). Never writes to live.
name: Sync Live DB to Stage

on:
  workflow_dispatch:

jobs:
  sync_live_to_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare configs on stage via FTP
        env:
          PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          STAGE_FTP_USERNAME: ${{ secrets.STAGE_FTP_USERNAME }}
          STAGE_FTP_PASSWORD: ${{ secrets.STAGE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p config scripts
          python3 <<'PY'
          from ftplib import FTP, error_perm
          import json, os, time
          from pathlib import Path

          def ftp_connect(user, password):
              last = None
              for attempt in range(1, 6):
                  try:
                      ftp = FTP()
                      ftp.connect('sigisolutions.net', 21, timeout=90)
                      ftp.login(user, password)
                      ftp.set_pasv(True)
                      return ftp
                  except Exception as e:
                      last = e
                      print(f'FTP connect attempt {attempt} failed: {e}')
                      time.sleep(5 * attempt)
              raise last

          def fetch(user, password, remote_path, local_path):
              ftp = ftp_connect(user, password)
              with open(local_path, 'wb') as fh:
                  ftp.retrbinary('RETR ' + remote_path, fh.write)
              ftp.quit()
              print(f'Downloaded {remote_path}')

          def upload(user, password, local_path, remote_path):
              ftp = ftp_connect(user, password)
              parts = remote_path.split('/')[:-1]
              cur = ''
              for p in parts:
                  if not p:
                      continue
                  cur = (cur + '/' + p) if cur else p
                  try:
                      ftp.mkd(cur)
                  except error_perm:
                      pass
              with open(local_path, 'rb') as fh:
                  ftp.storbinary('STOR ' + remote_path, fh)
              ftp.quit()
              print(f'Uploaded {remote_path}')

          fetch(os.environ['PROD_FTP_USERNAME'], os.environ['PROD_FTP_PASSWORD'],
                'config/config.json', 'config/config.prod.sync.json')
          fetch(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                'config/config.json', 'config/config.json')

          prod_raw = json.loads(Path('config/config.prod.sync.json').read_text())
          stage_raw = json.loads(Path('config/config.json').read_text())

          # Live site NODE_ENV=development → sigisolutions_laundary
          live = prod_raw.get('development') or prod_raw.get('production')
          if not live or not live.get('database'):
              raise SystemExit('No live DB config found on prodlaundry')
          if 'fomino' in str(live.get('database', '')).lower() and prod_raw.get('development'):
              live = prod_raw['development']

          for k in ('development', 'test', 'production'):
              prod_raw[k] = dict(live)

          # Stage: prefer real stagelaundry block (skip your_* placeholders)
          stage = None
          for k in ('development', 'test', 'production'):
              cfg = stage_raw.get(k) or {}
              db = str(cfg.get('database') or '')
              user = str(cfg.get('username') or '')
              if db and not db.startswith('your_') and not user.startswith('your_'):
                  stage = cfg
                  break
          if not stage:
              raise SystemExit('No real stage DB config found')
          for k in ('development', 'test', 'production'):
              if k in stage_raw:
                  stage_raw[k] = dict(stage)

          Path('config/config.prod.sync.json').write_text(json.dumps(prod_raw, indent=2) + '\n')
          Path('config/config.json').write_text(json.dumps(stage_raw, indent=2) + '\n')
          print(f'Live source: {live.get("database")} user={live.get("username")}')
          print(f'Stage target: {stage.get("database")} user={stage.get("username")}')

          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'config/config.prod.sync.json', 'config/config.prod.sync.json')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'config/config.json', 'config/config.json')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'scripts/live-to-stage-db-sync.js', 'scripts/live-to-stage-db-sync.js')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'scripts/run-live-to-stage-sync.sh', 'scripts/run-live-to-stage-sync.sh')
          PY

      - name: Sync DB + restart stage via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            export HOME=/home/sigisolutions
            source "$HOME/.nvm/nvm.sh"
            APP_ROOT="${{ secrets.APP_ROOT }}"
            if [ -z "$APP_ROOT" ]; then
              APP_ROOT=/home/sigisolutions/stagelaundry.sigisolutions.net
            fi
            cd "$APP_ROOT"

            # Prefer laundry-named live DB (prodlaundry uses NODE_ENV=development)
            node <<'JS'
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('config/config.prod.sync.json', 'utf8'));
            const live = c.development || c.production;
            if (!live || !live.database) throw new Error('missing live config');
            c.production = Object.assign({}, live);
            c.test = Object.assign({}, live);
            c.development = Object.assign({}, live);
            fs.writeFileSync('config/config.prod.sync.json', JSON.stringify(c, null, 2));
            console.log('Live source locked to', live.database, live.username);
            JS

            chmod +x scripts/run-live-to-stage-sync.sh || true
            bash scripts/run-live-to-stage-sync.sh

            # Free port / stop bad nodemon, then start PM2 stage cleanly
            fuser -k 8888/tcp 2>/dev/null || true
            pkill -f "nodemon.*laundary" 2>/dev/null || true
            pm2 delete laundary-stage || true
            pm2 start laundary.js --name laundary-stage
            pm2 save
            pm2 list | sed -n '1,30p'
            echo DONE
