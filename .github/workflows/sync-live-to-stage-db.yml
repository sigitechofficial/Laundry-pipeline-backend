# Live MySQL → Stage MySQL (stage overwrite only). Never writes to live.
name: Sync Live DB to Stage

on:
  workflow_dispatch:

jobs:
  sync_live_to_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (for sync scripts)
        uses: actions/checkout@v4

      - name: Upload sync scripts to stage via FTP
        continue-on-error: true
        env:
          STAGE_FTP_USERNAME: ${{ secrets.STAGE_FTP_USERNAME }}
          STAGE_FTP_PASSWORD: ${{ secrets.STAGE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          from ftplib import FTP, error_perm
          import os, time

          def connect():
              last = None
              for i in range(1, 6):
                  try:
                      ftp = FTP()
                      ftp.connect('sigisolutions.net', 21, timeout=90)
                      ftp.login(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'])
                      ftp.set_pasv(True)
                      return ftp
                  except Exception as e:
                      last = e
                      print('FTP retry', i, e)
                      time.sleep(5 * i)
              raise last

          def upload(local, remote):
              ftp = connect()
              parts = remote.split('/')[:-1]
              cur = ''
              for p in parts:
                  cur = (cur + '/' + p) if cur else p
                  try:
                      ftp.mkd(cur)
                  except error_perm:
                      pass
              with open(local, 'rb') as fh:
                  ftp.storbinary('STOR ' + remote, fh)
              ftp.quit()
              print('Uploaded', remote)

          upload('scripts/live-to-stage-db-sync.js', 'scripts/live-to-stage-db-sync.js')
          upload('scripts/run-live-to-stage-sync.sh', 'scripts/run-live-to-stage-sync.sh')
          PY

      - name: Sync Live→Stage DB and restart PM2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          STAGE_CONFIG_SECRET: ${{ secrets.CONFIG_JSON_CONTENT_STAGE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45m
          envs: STAGE_CONFIG_SECRET
          script: |
            set -euo pipefail
            export HOME=/home/sigisolutions
            source "$HOME/.nvm/nvm.sh"

            LIVE_ROOT=/home/sigisolutions/prodlaundry.sigisolutions.net
            STAGE_ROOT=/home/sigisolutions/stagelaundry.sigisolutions.net
            test -f "$LIVE_ROOT/config/config.json"
            mkdir -p "$STAGE_ROOT/config" "$STAGE_ROOT/scripts" "$STAGE_ROOT/backups"

            node <<'JS'
            const fs = require('fs');
            const LIVE_ROOT = '/home/sigisolutions/prodlaundry.sigisolutions.net';
            const STAGE_ROOT = '/home/sigisolutions/stagelaundry.sigisolutions.net';

            function parseMaybeJs(text) {
              text = String(text || '').replace(/^\uFEFF/, '');
              text = text.split(/\r?\n/).map(l => l.replace(/^\s+/, '')).join('\n').trim();
              try { return JSON.parse(text); }
              catch (e) { return Function('"use strict"; return (' + text + ')')(); }
            }
            function usable(cfg) {
              if (!cfg || !cfg.database) return false;
              const db = String(cfg.database);
              const user = String(cfg.username || '');
              return !db.startsWith('your_') && !user.startsWith('your_');
            }
            function pickStage(raw) {
              for (const k of ['development', 'test', 'production']) {
                if (usable(raw[k])) return raw[k];
              }
              return null;
            }

            const liveRaw = JSON.parse(fs.readFileSync(LIVE_ROOT + '/config/config.json', 'utf8'));
            let stageRaw = JSON.parse(fs.readFileSync(STAGE_ROOT + '/config/config.json', 'utf8'));
            let stage = pickStage(stageRaw);

            // If server stage config is placeholders only, rebuild from GitHub secret
            if (!stage && process.env.STAGE_CONFIG_SECRET) {
              stageRaw = parseMaybeJs(process.env.STAGE_CONFIG_SECRET);
              stage = pickStage(stageRaw);
              console.log('Loaded stage config from GitHub secret');
            }
            if (!stage) throw new Error('No real stage DB credentials available');

            // prodlaundry .env has NODE_ENV=development → sigisolutions_laundary
            const live = liveRaw.development || liveRaw.production;
            if (!live || !live.database) throw new Error('No live DB in prodlaundry config');
            console.log('Live source:', live.database, live.username);
            console.log('Stage target:', stage.database, stage.username);

            const prodSync = {
              development: Object.assign({}, live),
              test: Object.assign({}, live),
              production: Object.assign({}, live)
            };
            fs.writeFileSync(STAGE_ROOT + '/config/config.prod.sync.json', JSON.stringify(prodSync, null, 2));
            for (const k of ['development', 'test', 'production']) {
              if (stageRaw[k]) stageRaw[k] = Object.assign({}, stage);
            }
            fs.writeFileSync(STAGE_ROOT + '/config/config.json', JSON.stringify(stageRaw, null, 2));
            JS

            cd "$STAGE_ROOT"
            export APP_ROOT="$STAGE_ROOT"
            export PROD_CONFIG_PATH="$STAGE_ROOT/config/config.prod.sync.json"
            export STAGE_CONFIG_PATH="$STAGE_ROOT/config/config.json"
            export DB_BACKUP_DIR="$STAGE_ROOT/backups"
            export DB_SYNC_STATUS_PATH="$STAGE_ROOT/backups/live-to-stage-sync-status.json"

            node scripts/live-to-stage-db-sync.js
            echo SYNC_OK
            node -e "const s=require('./backups/live-to-stage-sync-status.json'); console.log(JSON.stringify({state:s.state,liveTableCount:s.liveTableCount,stageTableCount:s.stageTableCount,stageBackup:s.stageBackup,error:s.error},null,2))"

            fuser -k 8888/tcp 2>/dev/null || true
            pkill -f "nodemon.*laundary" 2>/dev/null || true
            pm2 delete laundary-stage || true
            pm2 start "$STAGE_ROOT/laundary.js" --name laundary-stage --cwd "$STAGE_ROOT"
            pm2 save
            pm2 list
            echo DONE
