# One-shot / on-demand: copy Live MySQL → Stage MySQL (stage overwrite only).
# Never writes to the live database.
# Both DBs are localhost on the cPanel host, so sync runs over SSH on that server.
name: Sync Live DB to Stage

on:
  workflow_dispatch:

jobs:
  sync_live_to_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch DB configs from servers (via FTP)
        id: cfg
        env:
          PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          STAGE_FTP_USERNAME: ${{ secrets.STAGE_FTP_USERNAME }}
          STAGE_FTP_PASSWORD: ${{ secrets.STAGE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p config backups
          python3 <<'PY'
          from ftplib import FTP
          import json, os
          from pathlib import Path

          def fetch(user, password, remote_path, local_path):
              ftp = FTP()
              ftp.connect('sigisolutions.net', 21, timeout=60)
              ftp.login(user, password)
              ftp.set_pasv(True)
              with open(local_path, 'wb') as fh:
                  ftp.retrbinary('RETR ' + remote_path, fh.write)
              ftp.quit()
              print(f'Downloaded {remote_path} -> {local_path} ({Path(local_path).stat().st_size} bytes)')

          def summarize(path):
              raw = json.loads(Path(path).read_text())
              print(f'== {path} env keys: {list(raw.keys()) if isinstance(raw, dict) else type(raw)}')
              if isinstance(raw, dict):
                  for k, v in raw.items():
                      if isinstance(v, dict) and 'database' in v:
                          print(f'  [{k}] host={v.get("host")} port={v.get("port", 3306)} db={v.get("database")} user={v.get("username")}')
              return raw

          fetch(os.environ['PROD_FTP_USERNAME'], os.environ['PROD_FTP_PASSWORD'],
                'config/config.json', 'config/config.prod.sync.json')
          fetch(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                'config/config.json', 'config/config.json')
          summarize('config/config.prod.sync.json')
          summarize('config/config.json')
          PY

      - name: Upload sync script + prod config to stage via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: sigisolutions.net
          username: ${{ secrets.STAGE_FTP_USERNAME }}
          password: ${{ secrets.STAGE_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.vscode/**
            **/backups/**
            **/.github/**
            **/migrations/**
            **/seeders/**
            **/Public/**
            **/docs/**
            **/examples/**
            **/controllers/**
            **/routes/**
            **/services/**
            **/middlewares/**
            **/utils/**
            **/helper/**
            **/models/**
            **/redis/**
            **/socket_io.js
            **/swagger.yaml
            **/package-lock.json
            **/laundary.js
            **/.env
            **/firebase.json
            **/.htaccess

      - name: Run Live→Stage DB sync over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            source "$HOME/.nvm/nvm.sh" 2>/dev/null || true
            export HOME="${HOME:-/home/sigisolutions}"
            APP_ROOT="${{ secrets.APP_ROOT }}"
            if [ -z "$APP_ROOT" ] || [ "$APP_ROOT" = "" ]; then
              APP_ROOT="/home/sigisolutions/stagelaundry.sigisolutions.net"
            fi
            cd "$APP_ROOT"
            mkdir -p backups
            # Prefer real env blocks; refuse obvious placeholders
            node <<'JS'
            const fs = require('fs');
            const path = require('path');
            function pick(raw, keys) {
              for (const k of keys) {
                if (raw[k] && raw[k].database) return { key: k, cfg: raw[k] };
              }
              if (raw.database) return { key: 'flat', cfg: raw };
              throw new Error('No DB config found');
            }
            const prodRaw = JSON.parse(fs.readFileSync('config/config.prod.sync.json', 'utf8'));
            const stageRaw = JSON.parse(fs.readFileSync('config/config.json', 'utf8'));
            const prod = pick(prodRaw, ['production', 'test', 'development']);
            const stage = pick(stageRaw, ['test', 'development', 'production']);
            const bad = /your_/i;
            if (bad.test(stage.cfg.database) || bad.test(stage.cfg.username || '')) {
              console.error('Stage config still has placeholder credentials:', stage.cfg.database, stage.cfg.username);
              console.error('Update GitHub secret CONFIG_JSON_CONTENT_STAGE (and redeploy stage) with the real stage MySQL database/user/password.');
              process.exit(2);
            }
            if (prod.cfg.host === stage.cfg.host && prod.cfg.database === stage.cfg.database) {
              console.error('Live and stage are the same database — refusing');
              process.exit(3);
            }
            console.log('Using prod env', prod.key, prod.cfg.host + '/' + prod.cfg.database);
            console.log('Using stage env', stage.key, stage.cfg.host + '/' + stage.cfg.database);
            JS
            export APP_ROOT
            export PROD_CONFIG_PATH="$APP_ROOT/config/config.prod.sync.json"
            export STAGE_CONFIG_PATH="$APP_ROOT/config/config.json"
            export DB_BACKUP_DIR="$APP_ROOT/backups"
            export DB_SYNC_STATUS_PATH="$APP_ROOT/backups/live-to-stage-sync-status.json"
            node scripts/live-to-stage-db-sync.js
            echo "SYNC_OK"
            # show status summary without dumping SQL
            node -e "const s=require('./backups/live-to-stage-sync-status.json'); console.log(JSON.stringify({state:s.state,phase:s.phase,liveTableCount:s.liveTableCount,stageTableCount:s.stageTableCount,stageBackup:s.stageBackup,error:s.error},null,2))"
