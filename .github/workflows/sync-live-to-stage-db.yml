# One-shot / on-demand: copy Live MySQL → Stage MySQL (stage overwrite only).
# Never writes to the live database.
# MySQL is localhost on cPanel, so the sync script must run on that host (SSH).
name: Sync Live DB to Stage

on:
  workflow_dispatch:

jobs:
  sync_live_to_stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch configs, normalize stage DB target, upload sync assets
        id: prep
        env:
          PROD_FTP_USERNAME: ${{ secrets.PROD_FTP_USERNAME }}
          PROD_FTP_PASSWORD: ${{ secrets.PROD_FTP_PASSWORD }}
          STAGE_FTP_USERNAME: ${{ secrets.STAGE_FTP_USERNAME }}
          STAGE_FTP_PASSWORD: ${{ secrets.STAGE_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p config backups scripts
          python3 <<'PY'
          from ftplib import FTP, error_perm
          import json, os
          from pathlib import Path

          def ftp_connect(user, password):
              ftp = FTP()
              ftp.connect('sigisolutions.net', 21, timeout=60)
              ftp.login(user, password)
              ftp.set_pasv(True)
              return ftp

          def fetch(user, password, remote_path, local_path):
              ftp = ftp_connect(user, password)
              with open(local_path, 'wb') as fh:
                  ftp.retrbinary('RETR ' + remote_path, fh.write)
              ftp.quit()
              print(f'Downloaded {remote_path} -> {local_path}')

          def upload(user, password, local_path, remote_path):
              ftp = ftp_connect(user, password)
              # ensure remote dirs
              parts = remote_path.split('/')[:-1]
              cur = ''
              for p in parts:
                  if not p:
                      continue
                  cur = (cur + '/' + p) if cur else p
                  try:
                      ftp.mkd(cur)
                  except error_perm:
                      pass
              with open(local_path, 'rb') as fh:
                  ftp.storbinary('STOR ' + remote_path, fh)
              ftp.quit()
              print(f'Uploaded {local_path} -> {remote_path}')

          def pick(raw, keys):
              for k in keys:
                  cfg = raw.get(k) if isinstance(raw, dict) else None
                  if not isinstance(cfg, dict) or not cfg.get('database'):
                      continue
                  db = str(cfg.get('database') or '')
                  user = str(cfg.get('username') or '')
                  if db.startswith('your_') or user.startswith('your_'):
                      continue
                  return k, cfg
              raise SystemExit('No non-placeholder DB config found in keys ' + ','.join(keys))

          fetch(os.environ['PROD_FTP_USERNAME'], os.environ['PROD_FTP_PASSWORD'],
                'config/config.json', 'config/config.prod.sync.json')
          fetch(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                'config/config.json', 'config/config.json')

          prod_raw = json.loads(Path('config/config.prod.sync.json').read_text())
          stage_raw = json.loads(Path('config/config.json').read_text())

          prod_key, prod = pick(prod_raw, ['production', 'test', 'development'])
          stage_key, stage = pick(stage_raw, ['development', 'test', 'production'])

          # Point all stage envs at the real stage DB (fixes placeholder test/production blocks).
          for k in ('development', 'test', 'production'):
              if k in stage_raw and isinstance(stage_raw[k], dict):
                  stage_raw[k] = dict(stage)
          Path('config/config.json').write_text(json.dumps(stage_raw, indent=2) + '\n')

          print(f'Live source [{prod_key}]: {prod.get("host")}/{prod.get("database")} user={prod.get("username")}')
          print(f'Stage target [{stage_key}]: {stage.get("host")}/{stage.get("database")} user={stage.get("username")}')
          if prod.get('host') == stage.get('host') and prod.get('database') == stage.get('database'):
              raise SystemExit('Live and stage resolve to the same database — refusing')

          # Upload only what the server-side sync needs
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'config/config.prod.sync.json', 'config/config.prod.sync.json')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'config/config.json', 'config/config.json')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'scripts/live-to-stage-db-sync.js', 'scripts/live-to-stage-db-sync.js')
          upload(os.environ['STAGE_FTP_USERNAME'], os.environ['STAGE_FTP_PASSWORD'],
                 'scripts/run-live-to-stage-sync.sh', 'scripts/run-live-to-stage-sync.sh')
          PY

      - name: Run sync over SSH (try key, then cPanel/FTP passwords)
        id: ssh
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            chmod +x /home/sigisolutions/stagelaundry.sigisolutions.net/scripts/run-live-to-stage-sync.sh || true
            bash /home/sigisolutions/stagelaundry.sigisolutions.net/scripts/run-live-to-stage-sync.sh

      - name: Retry SSH with STAGE FTP password as cPanel login
        id: ssh2
        if: steps.ssh.outcome != 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.STAGE_FTP_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            bash /home/sigisolutions/stagelaundry.sigisolutions.net/scripts/run-live-to-stage-sync.sh

      - name: Retry SSH with PROD FTP password as cPanel login
        id: ssh3
        if: steps.ssh.outcome != 'success' && steps.ssh2.outcome != 'success'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.PROD_FTP_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            bash /home/sigisolutions/stagelaundry.sigisolutions.net/scripts/run-live-to-stage-sync.sh

      - name: Require SSH sync success
        if: steps.ssh.outcome != 'success' && steps.ssh2.outcome != 'success' && steps.ssh3.outcome != 'success'
        run: |
          echo "SSH sync failed — no usable SSH key/password in GitHub secrets."
          echo "Stage config was normalized and sync scripts were uploaded."
          echo "In cPanel Terminal run ONE command:"
          echo "  bash /home/sigisolutions/stagelaundry.sigisolutions.net/scripts/run-live-to-stage-sync.sh"
          exit 1
